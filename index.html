<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<title>Sleep Countdown</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    min-height: 100vh;
    min-height: 100dvh;
  }
  h1 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #c9d1d9;
    margin-bottom: 6px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    font-size: 0.85rem;
    color: #6e7681;
    margin-bottom: 28px;
    text-align: center;
  }
  .controls {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #161b22;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid #21262d;
    margin-bottom: 30px;
    width: 100%;
    max-width: 340px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .row label {
    font-size: 0.9rem;
    color: #8b949e;
  }
  .group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  select, input[type="number"] {
    background: #0d1117;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 1rem;
    font-family: inherit;
    appearance: none;
    -webkit-appearance: none;
    text-align: center;
  }
  select { min-width: 58px; }
  input[type="number"] { width: 64px; -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .colon { color: #c9d1d9; font-weight: 700; font-size: 1.05rem; }
  /* Spunte attivita' serali: se disattivate, il tempo relativo non viene sottratto */
  .check {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: #8b949e;
    cursor: pointer;
    user-select: none;
  }
  .check input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin: 0;
    accent-color: #58a6ff;
    cursor: pointer;
  }
  .check .mins { color: #6e7681; font-size: 0.82rem; }
  .row.extras { justify-content: space-around; }
  .row.off .check, .row.off .unit { color: #484f58; }
  .row.off input[type="number"] { color: #484f58; border-color: #21262d; }
  .unit { color: #6e7681; font-size: 0.82rem; }
  .result {
    font-size: 4.6rem;
    font-weight: 700;
    letter-spacing: -0.04em;
    color: #58a6ff;
    line-height: 1;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .result.idle { color: #30363d; }
  .result.green { color: #3fb950; }
  .result.yellow { color: #d29922; }
  .result.red { color: #f85149; }
  .sub {
    font-size: 1rem;
    color: #8b949e;
    margin-bottom: 16px;
    font-variant-numeric: tabular-nums;
    text-align: center;
  }
  .info {
    max-width: 100%;
    font-size: 0.9rem;
    color: #c9d1d9;
    margin-bottom: 5px;
    text-align: center;
    line-height: 1.5;
  }
  .buffer {
    max-width: 100%;
    font-size: 0.75rem;
    color: #6e7681;
    font-style: italic;
    text-align: center;
  }
  .footer {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom) + 14px);
    left: 0; right: 0;
    text-align: center;
    font-size: 0.7rem;
    color: #484f58;
  }
</style>
</head>
<body>
  <h1>🌙 A che ora dormire</h1>
  <div class="subtitle">L'ora per coricarti e dormire quanto vuoi</div>

  <div class="controls">
    <div class="row">
      <label>Sveglia</label>
      <div class="group">
        <select id="wakeH" aria-label="Ora sveglia"></select>
        <span class="colon">:</span>
        <select id="wakeM" aria-label="Minuti sveglia"></select>
      </div>
    </div>
    <div class="row">
      <label>Voglio dormire</label>
      <div class="group">
        <select id="sleepH" aria-label="Ore di sonno"></select>
        <span class="colon">:</span>
        <select id="sleepM" aria-label="Minuti di sonno"></select>
      </div>
    </div>
    <div class="row" id="rowReading">
      <label class="check"><input id="readingOn" type="checkbox" checked aria-label="Includi lettura" />Lettura</label>
      <div class="group">
        <input id="reading" type="number" min="0" step="5" inputmode="numeric" aria-label="Minuti di lettura" />
        <span class="unit">min</span>
      </div>
    </div>
    <div class="row extras">
      <label class="check"><input id="caneOn" type="checkbox" checked aria-label="Includi passeggiata cane" />Cane <span class="mins">+20</span></label>
      <label class="check"><input id="cucinaOn" type="checkbox" checked aria-label="Includi cucina e igiene" />Cucina/igiene <span class="mins">+15</span></label>
    </div>
  </div>

  <div class="result idle" id="result">--:--</div>
  <div class="sub" id="sub">Imposta i dati</div>
  <div class="info" id="info"></div>
  <div class="buffer" id="buffer"></div>

  <div class="footer">Ora di coricarti calcolata a ritroso dalla sveglia</div>

<script>
  /* === Tempi fissi (minuti) — modificabili qui === */
  const BUFFER_MIN = 15;          // buffer di addormentamento (a letto -> sonno)
  const CANE_MIN   = 20;          // passeggiata cane
  const CUCINA_MIN = 15;          // riassetto cucina + pulizia personale
  const SOGLIA_GIALLO_MIN = 30;   // entro quanto dall'ora di coricarsi scatta il giallo
  const STORAGE_KEY = 'sleepCalc.v2';

  const wakeH   = document.getElementById('wakeH');
  const wakeM   = document.getElementById('wakeM');
  const sleepH  = document.getElementById('sleepH');
  const sleepM  = document.getElementById('sleepM');
  const reading = document.getElementById('reading');
  const readingOn = document.getElementById('readingOn');
  const caneOn    = document.getElementById('caneOn');
  const cucinaOn  = document.getElementById('cucinaOn');
  const buffer    = document.getElementById('buffer');
  const result  = document.getElementById('result');
  const sub     = document.getElementById('sub');
  const info    = document.getElementById('info');

  // Popola un <select> con un range numerico, opzionalmente con padding a 2 cifre
  function fill(sel, from, to, step, pad) {
    for (let v = from; v <= to; v += step) {
      const o = document.createElement('option');
      o.value = v;
      o.textContent = pad ? String(v).padStart(2, '0') : String(v);
      sel.appendChild(o);
    }
  }
  fill(wakeH, 0, 23, 1, true);    // ore sveglia
  fill(wakeM, 0, 55, 5, true);    // minuti sveglia (step 5)
  fill(sleepH, 4, 12, 1, true);   // ore di sonno desiderate
  fill(sleepM, 0, 45, 15, true);  // minuti di sonno (step 15)

  // Ripristina gli ultimi valori inseriti, altrimenti default 07:00 / 8:00 / 30'
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (saved) {
    wakeH.value = saved.wakeH; wakeM.value = saved.wakeM;
    sleepH.value = saved.sleepH; sleepM.value = saved.sleepM;
    reading.value = saved.reading;
    readingOn.checked = saved.readingOn !== false;
    caneOn.checked    = saved.caneOn !== false;
    cucinaOn.checked  = saved.cucinaOn !== false;
  } else {
    wakeH.value = 7; wakeM.value = 0;
    sleepH.value = 8; sleepM.value = 0;
    reading.value = 30;
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      wakeH: wakeH.value, wakeM: wakeM.value,
      sleepH: sleepH.value, sleepM: sleepM.value,
      reading: reading.value,
      readingOn: readingOn.checked,
      caneOn: caneOn.checked,
      cucinaOn: cucinaOn.checked,
    }));
  }

  // Prossima occorrenza dell'orario della sveglia (oggi se non ancora passato, altrimenti domani)
  function nextWake() {
    const now = new Date();
    const w = new Date(now);
    w.setHours(+wakeH.value, +wakeM.value, 0, 0);
    if (w <= now) w.setDate(w.getDate() + 1);
    return w;
  }

  const hhmm = d => String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const wd   = d => d.toLocaleDateString('it-IT', { weekday: 'short' });

  function tick() {
    // Attivita' serali: ogni spunta disattivata azzera il proprio tempo (i minuti di lettura restano memorizzati)
    const lettura  = readingOn.checked ? Math.max(0, parseInt(reading.value, 10) || 0) : 0;
    const cane     = caneOn.checked   ? CANE_MIN   : 0;
    const cucina   = cucinaOn.checked ? CUCINA_MIN : 0;
    const sonnoMin = (+sleepH.value) * 60 + (+sleepM.value);

    /* Calcolo a ritroso dalla sveglia:
       sveglia -> addormentato -> a letto (luci spente) -> ora di coricarsi (inizio routine) */
    const wake         = nextWake();
    const addormentato = new Date(wake.getTime() - sonnoMin * 60000);
    const aLetto       = new Date(addormentato.getTime() - BUFFER_MIN * 60000);
    const vaiADormire  = new Date(aLetto.getTime() - (lettura + cane + cucina) * 60000);

    result.textContent = hhmm(vaiADormire);

    // Countdown e semaforo rispetto ad adesso
    const now = new Date();
    const diffMin = Math.round((vaiADormire - now) / 60000);
    let cls, subTxt;
    if (diffMin <= 0) {
      // L'ora di coricarsi e' gia' passata: dormiresti meno del desiderato
      cls = 'red';
      const late = Math.abs(diffMin);
      subTxt = `in ritardo di ${Math.floor(late / 60)}h ${String(late % 60).padStart(2, '0')}m`;
    } else {
      cls = diffMin <= SOGLIA_GIALLO_MIN ? 'yellow' : 'green';
      subTxt = `tra ${Math.floor(diffMin / 60)}h ${String(diffMin % 60).padStart(2, '0')}m`;
    }
    result.className = 'result ' + cls;
    sub.textContent = subTxt;

    // Riepilogo: sveglia, sonno e orari intermedi
    const sonnoTxt = sonnoMin % 60 === 0
      ? `${sonnoMin / 60}h`
      : `${Math.floor(sonnoMin / 60)}h${String(sonnoMin % 60).padStart(2, '0')}`;
    info.innerHTML = `Sveglia <b>${wd(wake)} ${hhmm(wake)}</b> &middot; dormi ${sonnoTxt}<br>` +
                     `a letto ${hhmm(aLetto)} &middot; addormentato ${hhmm(addormentato)}`;

    // Riga dei tempi sottratti: mostra solo le voci attive
    const parti = [`+${BUFFER_MIN} addormentamento`];
    if (readingOn.checked) parti.push(`+${lettura} lettura`);
    if (caneOn.checked)    parti.push(`+${CANE_MIN} cane`);
    if (cucinaOn.checked)  parti.push(`+${CUCINA_MIN} cucina/igiene`);
    buffer.innerHTML = parti.join(' &middot; ');
    reading.disabled = !readingOn.checked;
    document.getElementById('rowReading').classList.toggle('off', !readingOn.checked);
  }

  [wakeH, wakeM, sleepH, sleepM, readingOn, caneOn, cucinaOn].forEach(el =>
    el.addEventListener('change', () => { persist(); tick(); }));
  reading.addEventListener('input', () => { persist(); tick(); });

  tick();
  setInterval(tick, 1000);

  // Tieni schermo acceso se possibile (su PWA installata)
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }

  // Service worker per offline
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
